<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Kerala Roof / Nest Icon -->
  <g transform="translate(4, 6)">
    <!-- Sloping Eaves / Roof Line -->
    <path d="M4 28 L24 8 L44 28" stroke="#0F4C3A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gable Peak Crown -->
    <path d="M24 8 L24 2" stroke="#C89B3C" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="24" cy="2" r="2.5" fill="#C89B3C"/>
    <!-- Modern Nest / House Body -->
    <path d="M12 28 L12 42 C12 44.2 13.8 46 16 46 L32 46 C34.2 46 36 44.2 36 42 L36 28" fill="#E8F4F0" stroke="#0F4C3A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Arched Traditional Kerala Door / Keyhole Motif -->
    <path d="M20 46 L20 36 C20 33.8 21.8 32 24 32 C26.2 32 28 33.8 28 36 L28 46" fill="#0F4C3A"/>
    <!-- Stylized Leaf Accent / Green Living -->
    <path d="M33 22 C37 18 42 20 42 24 C42 28 36 27 33 22 Z" fill="#2E7D32"/>
  </g>
  
  <!-- Typography -->
  <text x="60" y="33" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#0F4C3A">
    NEST<tspan fill="#C89B3C">KERALA</tspan>
  </text>
  <text x="61" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#64748B">
    FIND YOUR PERFECT HOME IN KERALA
  </text>
</svg>
